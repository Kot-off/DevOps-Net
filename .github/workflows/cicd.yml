name: CICD Pipeline

on:
  push:
    branches: [ "main", "master" ]

env:
  AWS_ACCESS_KEY_ID: ${{ secrets.YC_S3_ACCESS_KEY }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.YC_S3_SECRET_KEY }}
  TF_VAR_token: ${{ secrets.YC_TOKEN }}
  TF_VAR_cloud_id: ${{ secrets.YC_CLOUD_ID }}
  TF_VAR_folder_id: ${{ secrets.YC_FOLDER_ID }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./devops-diplom-yandexcloud
          file: ./devops-diplom-yandexcloud/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/diploma:${{ github.run_number }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to K8s cluster via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            echo "=== 1. Проверяем состояние кластера ==="
            kubectl get nodes

            echo "=== 2. Ищем директорию с манифестами ==="
            pwd
            ls -la

            if [ -d "devops-diplom-yandexcloud" ]; then
              cd devops-diplom-yandexcloud
            fi

            echo "=== 3. Проверяем наличие YAML файлов ==="
            find . -maxdepth 3 -name "*.yaml" -o -name "*.yml"

            echo "=== 4. Применяем деплой (если манифесты есть) ==="
            if [ -d "k8s" ]; then
              kubectl apply -f k8s/
            fi
            
            echo "=== 5. Проверяем запущенные поды ==="
            kubectl get pods,svc -o wide