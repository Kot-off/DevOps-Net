name: CICD Pipeline

on:
  push:
    branches: [ "main", "master" ]

env:
  AWS_ACCESS_KEY_ID: ${{ secrets.YC_S3_ACCESS_KEY }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.YC_S3_SECRET_KEY }}
  TF_VAR_cloud_id: ${{ secrets.YC_CLOUD_ID }}
  TF_VAR_folder_id: ${{ secrets.YC_FOLDER_ID }}

jobs:
  terraform:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Generate SSH Public Key for Terraform
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keygen -y -f ~/.ssh/id_rsa > ~/.ssh/id_rsa.pub

      - name: Terraform Init & Apply
        run: |
          cd devops-diplom-yandexcloud/terraform
          echo '${{ secrets.YC_SA_JSON }}' > key.json
          export YC_SERVICE_ACCOUNT_KEY_FILE="key.json"
          terraform init
          terraform apply -auto-approve
          rm key.json

  build:
    needs: terraform
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./devops-diplom-yandexcloud
          file: ./devops-diplom-yandexcloud/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/diploma:${{ github.run_number }}
            ${{ secrets.DOCKER_USERNAME }}/diploma:latest

  start-vm:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Install Yandex Cloud CLI
        run: |
          curl -sSL https://storage.yandexcloud.net/yandexcloud-yc/install.sh | bash
          echo "$HOME/yandex-cloud/bin" >> $GITHUB_PATH

      - name: Start VM if stopped
        run: |
          echo '${{ secrets.YC_SA_JSON }}' > key.json
          yc config set service-account-key key.json
          yc config set cloud-id ${{ secrets.YC_CLOUD_ID }}
          yc config set folder-id ${{ secrets.YC_FOLDER_ID }}

          STATUS=$(yc compute instance get control-plane --format json | jq -r .status)
          echo "Control-plane VM status: $STATUS"

          if [ "$STATUS" != "RUNNING" ]; then
            echo "Starting control-plane VM..."
            yc compute instance start control-plane
            sleep 30
          else
            echo "VM is already running."
          fi

          rm key.json

  deploy:
    needs: start-vm
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to K8s cluster via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script_stop: true
          script: |
            KUBECTL_BIN=$(which kubectl 2>/dev/null || find /usr /usr/local /snap /home /root -name kubectl 2>/dev/null | head -n 1)
            
            if [ -z "$KUBECTL_BIN" ]; then
              curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
              chmod +x kubectl
              KUBECTL_BIN="./kubectl"
            fi

            export KUBECONFIG=/etc/kubernetes/admin.conf

            curl -sSL https://raw.githubusercontent.com/Kot-off/DevOps-Net/main/devops-diplom-yandexcloud/k8s/app.yml -o app.yml
            sudo $KUBECTL_BIN --kubeconfig=/etc/kubernetes/admin.conf apply -f app.yml
            sudo $KUBECTL_BIN --kubeconfig=/etc/kubernetes/admin.conf set image deployment/diploma-app web=${{ secrets.DOCKER_USERNAME }}/diploma:${{ github.run_number }}
            sudo $KUBECTL_BIN --kubeconfig=/etc/kubernetes/admin.conf get pods,svc -o wide