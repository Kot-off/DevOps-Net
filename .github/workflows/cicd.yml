name: CICD Pipeline

on:
  push:
    branches: [ "main", "master" ]

env:
  AWS_ACCESS_KEY_ID: ${{ secrets.YC_S3_ACCESS_KEY }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.YC_S3_SECRET_KEY }}
  TF_VAR_token: ${{ secrets.YC_TOKEN }}
  TF_VAR_cloud_id: ${{ secrets.YC_CLOUD_ID }}
  TF_VAR_folder_id: ${{ secrets.YC_FOLDER_ID }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./devops-diplom-yandexcloud
          file: ./devops-diplom-yandexcloud/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/diploma:${{ github.run_number }}
            ${{ secrets.DOCKER_USERNAME }}/diploma:latest

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to K8s cluster via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            # Подставляем логин и свежий тег в манифест
            cat << 'EOF' > app.yml
            apiVersion: apps/v1
            kind: Deployment
            metadata:
              name: diploma-app
              labels:
                app: diploma-app
            spec:
              replicas: 2
              selector:
                matchLabels:
                  app: diploma-app
              template:
                metadata:
                  labels:
                    app: diploma-app
                spec:
                  containers:
                  - name: web
                    image: ${{ secrets.DOCKER_USERNAME }}/diploma:${{ github.run_number }}
                    ports:
                    - containerPort: 80
            ---
            apiVersion: v1
            kind: Service
            metadata:
              name: diploma-service
            spec:
              type: NodePort
              selector:
                app: diploma-app
              ports:
                - port: 80
                  targetPort: 80
                  nodePort: 30080
            EOF

            # Применяем в кластер
            kubectl apply -f app.yml

            # Выводим статус работы
            kubectl get pods,svc -o wide