apiVersion: apps/v1
kind: Deployment
metadata:
  name: diploma-app
  labels:
    app: diploma-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: diploma-app
  template:
    metadata:
      labels:
        app: diploma-app
    spec:
      containers:
      - name: web
        image: diploma:latest
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: diploma-service
spec:
  type: NodePort
  selector:
    app: diploma-app
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080